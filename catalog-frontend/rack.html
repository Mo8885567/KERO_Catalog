<!doctype html>
<html lang="ar" dir="rtl">
  <head>

    <link href="/assets/fonts/fonts.css" rel="stylesheet" />

  <body>
    <div id="rack"></div>

    <script src="/assets/rack/clothing-rack.js"></script>
    <script>
      // بيانات تجريبية: استبدلها ببيانات الكتالوج الحقيقية (شوف الشرح)

        {
          id: "tee-1", type: "tee", name: "تيشيرت بوكسي ثقيل", tagline: "قطن ٢٤٠ جم", price: 450,
          sizes: ["S", "M", "L", "XL"],
          colors: [
            { id: "sand", name: "رملي", hex: "#CDB89A", stock: { S: 3, M: 12, L: 9, XL: 0 } },
            { id: "navy", name: "كحلي", hex: "#1E2A44", stock: { S: 0, M: 7, L: 14, XL: 6 } },
          ],
        },
        {
          id: "hoodie-1", type: "hoodie", name: "هودي ثقيل", tagline: "٤٢٠ جم، جيب أمامي", price: 990,
          sizes: ["M", "L", "XL"],
          colors: [
            { id: "rust", name: "قرميدي", hex: "#B4533A", stock: { M: 2, L: 0, XL: 5 } },
            { id: "bone", name: "أوف وايت", hex: "#EEEAE0", stock: { M: 8, L: 8, XL: 8 } },

        {

        },
      ];

      ClothingRack.mount("#rack", {
        products,
        locale: "ar-EG",
        currency: "EGP",
        labels: ClothingRack.labels.ar,
        onAddToCart: ({ product, color, size }) => console.log(product.id, color.id, size),
      });
    </script>
  </body>
